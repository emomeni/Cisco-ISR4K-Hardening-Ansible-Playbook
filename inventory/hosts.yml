---
# Inventory for Cisco ISR 4000 Series Hardening Playbook
#
# Connection: ansible.netcommon.network_cli over SSH
# Platform:   Cisco IOS XE
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml cisco_isr4k_hardening.yml --ask-vault-pass
#
# Vault-encrypted variables live in group_vars/all.yml.
# Encrypt that file with:
#   ansible-vault encrypt group_vars/all.yml

all:
  children:
    isr4k_routers:
      hosts:
        isr4k-core-01:
          ansible_host: 10.0.100.1
        isr4k-core-02:
          ansible_host: 10.0.100.2
        isr4k-branch-01:
          ansible_host: 10.0.200.1

      vars:
        # Connection settings - network_cli over SSH to IOS XE
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.ios.ios
        ansible_user: "{{ vault_ansible_user }}"
        ansible_password: "{{ vault_ansible_password }}"

        # Privilege escalation (enable mode)
        ansible_become: true
        ansible_become_method: enable
        ansible_become_password: "{{ vault_enable_secret }}"

        # SSH transport options
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
        ansible_persistent_connect_timeout: 120
        ansible_persistent_command_timeout: 60
